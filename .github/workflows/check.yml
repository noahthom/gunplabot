name: Gunpla check
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: gunpla-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install @anthropic-ai/sdk
      - run: node tracker.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - run: |
          git config user.name "gunpla-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen kits" && git pull --rebase -X theirs origin main && git push)
